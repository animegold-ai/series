<!DOCTYPE html>
<html>
<head>
  <title>Earn Points - AnimeGold</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: linear-gradient(-45deg, #1a0033, #2d0052, #0a0a2e, #16213e);
      background-size: 400% 400%;
      animation: gradient 15s ease infinite;
      font-family: 'Arial', sans-serif;
      background-attachment: fixed;
      color: #fff;
      text-align: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    @keyframes gradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(255, 152, 0, 0.5);
      border-radius: 50%;
      animation: float 20s infinite;
    }

    .particle:nth-child(1) { left: 10%; top: 20%; animation-delay: 0s; }
    .particle:nth-child(2) { left: 80%; top: 80%; animation-delay: 2s; }
    .particle:nth-child(3) { left: 50%; top: 50%; animation-delay: 4s; }
    .particle:nth-child(4) { left: 20%; top: 70%; animation-delay: 6s; }
    .particle:nth-child(5) { left: 90%; top: 30%; animation-delay: 8s; }
    .particle:nth-child(6) { left: 30%; top: 10%; animation-delay: 10s; }
    .particle:nth-child(7) { left: 70%; top: 60%; animation-delay: 12s; }
    .particle:nth-child(8) { left: 15%; top: 50%; animation-delay: 14s; }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translate(100px, -100px) scale(0.5); opacity: 0; }
    }

    h1 {
      font-size: 2em;
      margin: 30px 0 10px 0;
      background: linear-gradient(135deg, #ff9800, #ffb84d, #ff6b00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: glow 2s ease-in-out infinite;
    }

    @keyframes glow {
      0%, 100% { filter: drop-shadow(0 0 10px rgba(255, 152, 0, 0.5)); }
      50% { filter: drop-shadow(0 0 20px rgba(255, 152, 0, 0.8)); }
    }

    .section {
      background: linear-gradient(135deg, rgba(51, 51, 51, 0.8), rgba(33, 33, 33, 0.8));
      border-left: 5px solid #ff9800;
      border-radius: 10px;
      padding: 20px;
      margin: 20px auto;
      max-width: 800px;
      box-shadow: 0 0 20px rgba(255, 152, 0, 0.2);
    }

    .status-badge {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 25px;
      font-weight: bold;
      font-size: 16px;
      margin: 10px 0;
    }

    .status-badge.status-active {
      background: #27ae60;
      color: white;
    }

    .status-badge.status-inactive {
      background: #95a5a6;
      color: white;
    }

    .status-badge.status-banned {
      background: #c0392b;
      color: white;
    }

    p { margin: 10px 0; font-size: 16px; }

    select, input[type="text"], input[type="number"] {
      padding: 10px;
      border-radius: 5px;
      border: none;
      background: #222;
      color: #fff;
      margin: 10px 0;
      font-size: 14px;
      width: 100%;
      max-width: 400px;
    }

    select:hover, input:hover {
      background: #333;
    }

    button {
      background: linear-gradient(135deg, #ff9800, #ffb84d);
      border: none;
      padding: 12px 30px;
      border-radius: 8px;
      cursor: pointer;
      color: #111;
      font-weight: bold;
      font-size: 16px;
      transition: all 0.3s ease;
      margin: 10px;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(255, 152, 0, 0.6);
    }

    button:active {
      transform: scale(0.95);
    }

    #seriesFrame {
      width: 100%;
      max-width: 640px;
      height: 360px;
      border-radius: 10px;
      border: 3px solid #ff9800;
      margin: 20px auto;
      display: block;
      box-shadow: 0 0 30px rgba(255, 152, 0, 0.3);
    }

    .wheel-container {
      position: relative;
      width: 300px;
      height: 300px;
      margin: 30px auto;
    }

    #wheel {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5), 0 0 30px rgba(255, 152, 0, 0.4);
    }

    .pointer {
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-top: 20px solid #ffb84d;
      z-index: 10;
      filter: drop-shadow(0 0 5px rgba(255, 180, 77, 0.8));
    }

    .spin-button {
      background: linear-gradient(135deg, #27ae60, #2ecc71);
      border: none;
      padding: 12px 30px;
      border-radius: 8px;
      cursor: pointer;
      color: white;
      font-weight: bold;
      font-size: 16px;
      transition: all 0.3s ease;
    }

    .spin-button:hover:not(:disabled) {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(46, 204, 113, 0.6);
    }

    .spin-button:disabled {
      background: #95a5a6;
      cursor: not-allowed;
    }

    .error {
      color: #e74c3c;
      font-weight: bold;
      margin: 10px 0;
    }

    .success {
      color: #27ae60;
      font-weight: bold;
      margin: 10px 0;
    }

    .notification {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #27ae60;
      color: white;
      padding: 15px 20px;
      border-radius: 5px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
      z-index: 1000;
      animation: slideIn 0.3s ease;
    }

    .notification.error {
      background: #e74c3c;
    }

    @keyframes slideIn {
      from {
        transform: translateX(400px);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    .notifications-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .logout-button {
      position: fixed;
      top: 20px;
      left: 20px;
      background: #e74c3c;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      z-index: 999;
    }

    .logout-button:hover {
      background: #c0392b;
    }

    .interaction-stats {
      background: #222;
      padding: 15px;
      border-radius: 5px;
      margin: 15px auto;
      max-width: 600px;
      text-align: left;
      font-size: 13px;
      text-align: left;
    }

    .interaction-stats p {
      margin: 5px 0;
      color: #ffb84d;
    }

    .autoplay-toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: center;
      margin: 15px 0;
    }

    .autoplay-toggle input[type="checkbox"] {
      width: 20px;
      height: 20px;
      cursor: pointer;
    }

    .autoplay-toggle label {
      cursor: pointer;
      font-weight: bold;
      color: #ffb84d;
    }

    /* Episode Grid Styles */
    .episodes-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 8px;
      margin: 15px 0;
    }

    .episode-btn {
      background: #333;
      border: 2px solid #555;
      color: #fff;
      padding: 8px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      font-size: 12px;
      transition: all 0.3s ease;
    }

    .episode-btn:hover {
      background: #444;
      border-color: #ff9800;
    }

    .episode-btn.active {
      background: #ff9800;
      border-color: #ff9800;
      color: #111;
    }

    .episode-btn.watched {
      background: #27ae60;
      border-color: #2ecc71;
    }
  </style>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, collection, query, where, getDocs, arrayUnion } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB6qQybRVw4nlwGA-Kp8d6kCqOhdqo11Aw",
      authDomain: "animegold-bf2a7.firebaseapp.com",
      projectId: "animegold-bf2a7",
      storageBucket: "animegold-bf2a7.firebasestorage.app",
      messagingSenderId: "1055086176557",
      appId: "1:1055086176557:web:aca8f68412e95ef369cba4",
      measurementId: "G-J9LX9WMPJK"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let userRef, userData = {}, minuteCounter = 0, watching = false, updateInterval;
    let isSpinning = false;
    let currentUserName = "User";
    let currentRotation = 0;
    let heartbeatInterval;
    let lastHeartbeatTime = Date.now();
    let autoplayEnabled = localStorage.getItem('autoplayEnabled') === 'true';
    let currentSeries = "system-analyzer";
    let currentEpisode = 1;
    let watchedEpisodes = new Set();

    // ✅ NEW: Watch Session Tracking
    let currentWatchSession = null;
    let interactionStats = {
      clicks: 0,
      touches: 0,
      mouseEnters: 0,
      totalFocusTime: 0,
      lastInteractionTime: Date.now(),
      iframeInView: false
    };

    const wheelPrizes = [
      { points: 1, label: "1 Point", color: "#FFD700" },
      { points: 5, label: "5 Points", color: "#FF6B6B" },
      { points: 2, label: "2 Points", color: "#4ECDC4" },
      { points: 10, label: "10 Points", color: "#95E1D3" },
      { points: 3, label: "3 Points", color: "#F38181" },
      { points: 7, label: "7 Points", color: "#AA96DA" },
      { points: 4, label: "4 Points", color: "#FCBAD3" },
      { points: 8, label: "8 Points", color: "#A8D8EA" }
    ];

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "index.html";
        return;
      }

      userRef = doc(db, "users", user.uid);
      const userSnap = await getDoc(userRef);
      
      if (!userSnap.exists()) {
        await setDoc(userRef, {
          username: user.email.split("@")[0],
          email: user.email,
          minuteCounter: 0,
          activityStatus: "inactive",
          createdAt: new Date().toISOString(),
          lastActivityTime: new Date().toISOString(),
          watchedEpisodes: {}
        });
      }

      userData = userSnap.data() || {};
      minuteCounter = userData.minuteCounter || 0;
      currentUserName = userData.username || "User";

      // Load watched episodes
      if (userData.watchedEpisodes && userData.watchedEpisodes[currentSeries]) {
        watchedEpisodes = new Set(userData.watchedEpisodes[currentSeries]);
      }

      document.getElementById("greeting").textContent = `Welcome, ${currentUserName}! 🎯`;
      document.getElementById("points").textContent = (minuteCounter / 300).toFixed(4) + " points";
      
      const earnings = userData.earnings || {};
      document.getElementById("pending").textContent = earnings.pending || "0";
      document.getElementById("total").textContent = earnings.total || "0";

      // ✅ Set autoplay checkbox
      document.getElementById("autoplayToggle").checked = autoplayEnabled;

      createWheelCanvas();
      generateEpisodeButtons();
    });

    window.logout = () => {
      signOut(auth).then(() => {
        window.location.href = "index.html";
      });
    };

    function generateEpisodeButtons() {
      const container = document.getElementById("episodesGrid");
      if (!container) return;
      container.innerHTML = "";
      
      for (let i = 1; i <= 30; i++) {
        const btn = document.createElement("button");
        btn.className = "episode-btn";
        btn.textContent = i;
        
        if (i === currentEpisode) {
          btn.classList.add("active");
        }
        if (watchedEpisodes.has(i)) {
          btn.classList.add("watched");
        }
        
        btn.onclick = () => loadEpisode(i);
        container.appendChild(btn);
      }
    }

    window.loadEpisode = (episodeNum) => {
      currentEpisode = episodeNum;
      const seriesName = document.getElementById("seriesSelect").options[document.getElementById("seriesSelect").selectedIndex].text;
      const url = `https://trimz.tv/${currentSeries}`;
      document.getElementById("seriesFrame").src = url;
      generateEpisodeButtons();
      watching = true;
      startHeartbeat();

      currentWatchSession = {
        seriesName: seriesName,
        episode: episodeNum,
        startTime: new Date().toISOString(),
        pointsEarnedAtStart: minuteCounter / 300
      };

      interactionStats = {
        clicks: 0,
        touches: 0,
        mouseEnters: 0,
        totalFocusTime: 0,
        lastInteractionTime: Date.now(),
        iframeInView: false
      };

      setDoc(userRef, { 
        activityStatus: "active", 
        lastActivityTime: new Date().toISOString(),
        currentWatchSession: currentWatchSession,
        interactionData: interactionStats
      }, { merge: true });

      document.getElementById("statusBadge").textContent = "🟢 ACTIVE";
      document.getElementById("statusBadge").className = "status-badge status-active";
    };

    window.changeSeries = async () => {
      const selectedSeries = document.getElementById("seriesSelect").value;
      currentSeries = selectedSeries;
      currentEpisode = 1;

      // Load watched episodes for this series
      if (userData.watchedEpisodes && userData.watchedEpisodes[currentSeries]) {
        watchedEpisodes = new Set(userData.watchedEpisodes[currentSeries]);
      } else {
        watchedEpisodes.clear();
      }

      generateEpisodeButtons();
      document.getElementById("seriesFrame").src = "";
    };

    function createWheelCanvas() {
      const canvas = document.getElementById('wheel');
      if (!canvas) return;
      
      const ctx = canvas.getContext('2d');
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const radius = Math.min(centerX, centerY) - 10;
      const sliceAngle = (Math.PI * 2) / wheelPrizes.length;

      wheelPrizes.forEach((prize, index) => {
        const startAngle = index * sliceAngle;
        const endAngle = (index + 1) * sliceAngle;

        ctx.fillStyle = prize.color;
        ctx.beginPath();
        ctx.arc(centerX, centerY, radius, startAngle, endAngle);
        ctx.lineTo(centerX, centerY);
        ctx.fill();

        ctx.strokeStyle = '#111';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(centerX, centerY, radius, startAngle, endAngle);
        ctx.lineTo(centerX, centerY);
        ctx.stroke();

        const textAngle = startAngle + sliceAngle / 2;
        const textX = centerX + Math.cos(textAngle) * (radius * 0.7);
        const textY = centerY + Math.sin(textAngle) * (radius * 0.7);

        ctx.fillStyle = '#111';
        ctx.font = 'bold 14px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(prize.label, textX, textY);
      });

      const centerCircleRadius = 30;
      ctx.fillStyle = '#ff9800';
      ctx.beginPath();
      ctx.arc(centerX, centerY, centerCircleRadius, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#fff';
      ctx.font = 'bold 20px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('SPIN', centerX, centerY);
    }

    window.spin = async () => {
      if (isSpinning || minuteCounter < 300) {
        alert("You need 300 points (1 minute watched) to spin!");
        return;
      }

      isSpinning = true;
      document.querySelector('.spin-button').disabled = true;

      await setDoc(userRef, { minuteCounter }, { merge: true });

      const wheel = document.getElementById('wheel');
      wheel.style.transition = 'none';
      wheel.style.transform = `rotate(${currentRotation}deg)`;
      void wheel.offsetWidth;
      
      const spins = 10;
      const extraDegrees = Math.floor(Math.random() * 360);
      const totalRotation = spins * 360 + extraDegrees;
      
      wheel.style.transition = 'transform 3s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
      wheel.style.transform = `rotate(${currentRotation + totalRotation}deg)`;

      await new Promise(resolve => setTimeout(resolve, 3000));

      currentRotation = (currentRotation + totalRotation) % 360;

      const winningIndex = Math.floor((360 - (extraDegrees % 360)) / (360 / wheelPrizes.length)) % wheelPrizes.length;
      const prize = wheelPrizes[winningIndex];

      const pointsToAdd = prize.points * 300;
      minuteCounter += pointsToAdd;

      await setDoc(userRef, { minuteCounter }, { merge: true });

      document.getElementById("points").textContent = (minuteCounter / 300).toFixed(4) + " points";

      showNotification(`🎉 You won ${prize.points} points! Total: ${(minuteCounter / 300).toFixed(4)} points`);

      isSpinning = false;
      document.querySelector('.spin-button').disabled = false;
    };

    function showNotification(message, isError = false) {
      const notification = document.createElement('div');
      notification.className = `notification ${isError ? 'error' : ''}`;
      notification.textContent = message;
      document.querySelector('.notifications-container').appendChild(notification);

      setTimeout(() => {
        notification.remove();
      }, 3000);
    }

    function startHeartbeat() {
      heartbeatInterval = setInterval(() => {
        lastHeartbeatTime = Date.now();
      }, 5000);
    }

    function stopHeartbeat() {
      if (heartbeatInterval) clearInterval(heartbeatInterval);
    }

    window.stopWatching = async () => {
      watching = false;
      stopHeartbeat();
      if (updateInterval) clearInterval(updateInterval);

      if (currentWatchSession) {
        const sessionDuration = Math.floor((Date.now() - Date.parse(currentWatchSession.startTime)) / 1000 / 60);
        const pointsEarned = (minuteCounter / 300) - currentWatchSession.pointsEarnedAtStart;
        
        // Mark episode as watched
        watchedEpisodes.add(currentEpisode);
        
        try {
          const watchedData = userData.watchedEpisodes || {};
          if (!watchedData[currentSeries]) {
            watchedData[currentSeries] = [];
          }
          watchedData[currentSeries] = Array.from(watchedEpisodes);

          await setDoc(userRef, {
            watchSessions: arrayUnion({
              series: currentWatchSession.seriesName,
              episode: currentWatchSession.episode,
              startTime: currentWatchSession.startTime,
              endTime: new Date().toISOString(),
              durationMinutes: sessionDuration,
              pointsEarned: pointsEarned,
              interactions: interactionStats
            }),
            watchedEpisodes: watchedData
          }, { merge: true });
        } catch (err) {
          console.error("Error saving watch session:", err);
        }

        currentWatchSession = null;
      }

      await setDoc(userRef, { activityStatus: "inactive" }, { merge: true });

      document.getElementById("statusBadge").textContent = "⚫ INACTIVE";
      document.getElementById("statusBadge").className = "status-badge status-inactive";

      document.getElementById("seriesFrame").src = "";
      generateEpisodeButtons();
      alert("Stopped watching. Status set to Inactive.");
    };

    window.toggleAutoplay = () => {
      autoplayEnabled = document.getElementById("autoplayToggle").checked;
      localStorage.setItem('autoplayEnabled', autoplayEnabled);
      showNotification(`Autoplay ${autoplayEnabled ? 'enabled' : 'disabled'}`);
    };

    // Interaction tracking
    document.addEventListener('click', () => {
      if (watching) interactionStats.clicks++;
    });

    document.addEventListener('touchstart', () => {
      if (watching) interactionStats.touches++;
    });

    // Real-time point updates
    if (updateInterval) clearInterval(updateInterval);
    updateInterval = setInterval(() => {
      if (watching) {
        minuteCounter += 5;
        document.getElementById("points").textContent = (minuteCounter / 300).toFixed(4) + " points";
      }
    }, 60000);

    window.onunload = () => {
      if (updateInterval) clearInterval(updateInterval);
      stopHeartbeat();
    };
  </script>
</head>
<body>
  <button class="logout-button" onclick="logout()">🚪 Logout</button>

  <div class="particles">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>

  <div id="notificationsContainer" class="notifications-container"></div>

  <h1 id="greeting">Loading...</h1>
  
  <div class="section">
    <div id="statusBadge" class="status-badge status-inactive">⚫ INACTIVE</div>
    <p>Total Points: <span id="points">0.0000 points</span></p>
    <p>Pending Earnings: ₱<span id="pending">0</span></p>
    <p>Total Earnings: ₱<span id="total">0</span></p>
  </div>

  <div class="section">
    <h2>👀 Watch Series</h2>
    <select id="seriesSelect" onchange="changeSeries()">
      <option value="system-analyzer">System Analyzer</option>
      <option value="the-gamer">The Gamer</option>
      <option value="player-reborn">Player Reborn</option>
      <option value="quest-supremacy">Quest Supremacy</option>
      <option value="99-reinforced-wooden-stick">+99 Reinforced Wooden Stick</option>
      <option value="slam-jam">Slam Jam</option>
      <option value="guardians-of-rokia">Guardians of Rokia</option>
      <option value="lifeexe">Life.exe</option>
    </select>

    <p style="margin-top: 15px; margin-bottom: 10px; font-size: 14px; color: #ffb84d;">Select Episode:</p>
    <div id="episodesGrid" class="episodes-grid"></div>

    <!-- ✅ AUTOPLAY TOGGLE -->
    <div class="autoplay-toggle">
      <input type="checkbox" id="autoplayToggle" onchange="toggleAutoplay()">
      <label for="autoplayToggle">Enable Autoplay Next Episode</label>
    </div>

    <div style="margin-top:20px;">
      <iframe id="seriesFrame" width="640" height="360" frameborder="0" allowfullscreen></iframe>
    </div>

    <!-- ✅ NEW: Show interaction stats while watching -->
    <div id="interactionStats" class="interaction-stats"></div>

    <button onclick="stopWatching()" style="background: linear-gradient(135deg, #e74c3c, #c0392b); color: #fff;">Stop Watching</button>
  </div>

  <div class="section">
    <h2>🎰 Daily Spin Wheel</h2>
    <div class="wheel-container">
      <div class="pointer"></div>
      <canvas id="wheel" width="300" height="300"></canvas>
    </div>
    <button class="spin-button" onclick="spin()">SPIN NOW</button>
  </div>
</body>
</html>
